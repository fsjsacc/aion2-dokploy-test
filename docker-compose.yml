# AION2-KINA 测试环境 — 蓝绿演练 + 卷继承实验（脚本渲染，勿手改）
# 拓扑: Traefik → edge(唯一真实域名 router) → app-a | app-b（各自独立卷）
# 每槽另有 canary 假域名 router，用于未接流量时体检 standby。
# 不要写 container_name：Dokploy 用 docker compose -p <project> 管理。

services:
  edge:
    build:
      context: ./edge
    restart: unless-stopped
    depends_on:
      - app-a
      - app-b
    environment:
      NGINX_ENVSUBST_FILTER: "UPSTREAM_"
      UPSTREAM_HOST: app-a
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aion2-kina-test.rule=Host(`test.aion2kina.com`)"
      - "traefik.http.routers.aion2-kina-test.entrypoints=websecure"
      - "traefik.http.routers.aion2-kina-test.tls=true"
      - "traefik.http.services.aion2-kina-test.loadbalancer.server.port=80"

  app-a:
    build:
      context: ./app
      args:
        SLOT_DIST: dist-a
    restart: unless-stopped
    env_file: .env
    environment:
      ASSETS: /app/dist/client
    volumes:
      - kina-test-state-v2:/app/dist/server/.wrangler/state/v3
      - bg-data-a:/app/data
    mem_limit: 2g
    memswap_limit: 2560m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/en/').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aion2-slot-a.rule=Host(`aion2-slot-a.local`)"
      - "traefik.http.routers.aion2-slot-a.entrypoints=websecure"
      - "traefik.http.routers.aion2-slot-a.tls=true"
      - "traefik.http.services.aion2-slot-a.loadbalancer.server.port=3001"

  app-b:
    build:
      context: ./app
      args:
        SLOT_DIST: dist-b
    restart: unless-stopped
    env_file: .env
    environment:
      ASSETS: /app/dist/client
    volumes:
      - bg-state-b:/app/dist/server/.wrangler/state/v3
      - bg-data-b:/app/data
    mem_limit: 2g
    memswap_limit: 2560m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/en/').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aion2-slot-b.rule=Host(`aion2-slot-b.local`)"
      - "traefik.http.routers.aion2-slot-b.entrypoints=websecure"
      - "traefik.http.routers.aion2-slot-b.tls=true"
      - "traefik.http.services.aion2-slot-b.loadbalancer.server.port=3001"

volumes:
  bg-data-a:
    external: true
    name: kina-test-7yrpj5_bg-data-a
  bg-data-b:
    external: true
    name: kina-test-7yrpj5_bg-data-b
  bg-state-a:
    external: true
    name: kina-test-7yrpj5_bg-state-a
  bg-state-b:
    external: true
    name: kina-test-7yrpj5_bg-state-b
  kina-test-state-v2:
    external: true
    name: kina-test-7yrpj5_kina-test-state-v2
