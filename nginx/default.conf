# AION2-KINA nginx — Dokploy deployment
# Acts as reverse proxy between Traefik and app container
# Adds security headers for ALL static assets (sprites, map tiles, map data)
# These resources are served by wrangler dev ASSETS binding, which bypasses
# the Worker fetch handler and cannot add custom headers.

server {
    listen 80;
    server_name _;

    # Static assets — add CORS and security headers for all map-related resources
    # Covers: /sprites/, /map-assets/, /data/
    location ~* ^/(sprites|map-assets|data)/ {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for MapLibre GL JS WebGL texture loading (sprites)
        add_header cross-origin-resource-policy "same-origin" always;
        add_header x-content-type-options "nosniff" always;

        # Long cache for immutable static assets
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # Proxy all other requests to app container
    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
